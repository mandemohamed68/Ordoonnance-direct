# ==============================================================================
# Configuration Nginx pour Déploiement Host avec PM2 & SSL - Ordonnance Direct
# Emplacement recommandé sur le serveur : 
#   - Debian / Ubuntu : /etc/nginx/sites-available/ordonnance-direct
#   - CentOS / RHEL / Fedora : /etc/nginx/conf.d/ordonnance-direct.conf
# ==============================================================================

# Compression Gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# Upstream vers le cluster PM2 (Port 3000)
upstream ordonnance_pm2_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ============================================================
# 1. Redirection HTTP vers HTTPS (Port 80 -> Port 443)
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _ localhost;

    # Emplacement pour challenge Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirection permanente vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# 2. Serveur Sécurisé HTTPS (Port 443) avec Proxy vers PM2
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _ localhost;

    # Taille max des requêtes (photos d'ordonnances & uploads jusqu'à 50 Mo)
    client_max_body_size 50M;

    # 🔒 Chemins vers les certificats SSL (générés par scripts/generate-ssl.sh ou Let's Encrypt)
    # Ajustez le chemin absolu si nécessaire vers le dossier de votre projet
    ssl_certificate     /etc/nginx/ssl/ordonnance-direct.crt;
    ssl_certificate_key /etc/nginx/ssl/ordonnance-direct.key;

    # Paramètres de sécurité SSL modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # En-têtes de protection
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy vers l'application Node.js gérée par PM2
    location / {
        proxy_pass http://ordonnance_pm2_backend;
        proxy_http_version 1.1;

        # Support des WebSockets & Server-Sent Events (SSE) temps réel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # En-têtes de transfert IP et hôte
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Délais d'attente allongés pour analyse IA et envoi de fichiers
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Streaming en direct sans mise en mémoire tampon
        proxy_buffering off;
    }

    # Cache pour fichiers statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://ordonnance_pm2_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
